<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — SpacePill</title>
    <meta name="description" content="This Space doesn't exist.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="/" aria-label="SpacePill home">
                <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
                    <rect x="2" y="14" width="60" height="36" rx="18" fill="#3d7bfd" stroke="#000" stroke-opacity="0.55" stroke-width="4"/>
                    <circle cx="21" cy="32" r="11" fill="#12305e" stroke="#000" stroke-opacity="0.6" stroke-width="2"/>
                    <rect x="38" y="27" width="17" height="4" rx="2" fill="#fff" fill-opacity="0.9"/>
                    <rect x="38" y="35" width="11" height="4" rx="2" fill="#fff" fill-opacity="0.6"/>
                </svg>
                SpacePill
            </a>
        </div>
    </header>

    <main class="notfound container">
        <div>
            <span class="pill" aria-hidden="true">
                <span class="num">?</span>
                <span class="label">404</span>
            </span>
            <h1>This Space doesn't exist.</h1>
            <p>
                No desktop matches that name — it may have been removed, or it
                was never here. Even fuzzy matching has its limits.
            </p>
            <div class="actions">
                <a class="btn btn-primary" href="/">Jump to home</a>
                <a class="btn btn-ghost" href="https://github.com/jakequist/spacepill">GitHub</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>SpacePill · made for macOS 13+</span>
            <nav aria-label="Footer">
                <a href="https://github.com/jakequist/spacepill">GitHub</a>
                <a href="https://github.com/jakequist/spacepill/releases">Releases</a>
                <a href="https://github.com/jakequist/spacepill/blob/main/LICENSE">MIT License</a>
            </nav>
        </div>
    </footer>
</body>
</html>
