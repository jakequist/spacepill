name: Deploy site

# Publishes /website to GitHub Pages (https://spacepill.dev) whenever the site
# changes. Decoupled from releases on purpose: site fixes ship the moment they
# land on main, without cutting a version.
#
# ONE-TIME SETUP: repo Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions". (Not "Deploy from a branch".) The custom domain is also set
# in Pages settings; DNS for spacepill.dev lives in Cloudflare (DNS-only records
# pointing at GitHub Pages, so GitHub can issue the TLS certificate).

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'install.sh'
  workflow_dispatch:

# Allow one concurrent deploy; let an in-progress run finish rather than cancel,
# so a half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Serve the installer at https://spacepill.dev/install.sh from the single
      # canonical copy at the repo root.
      - name: Stage installer for the site
        run: cp install.sh website/install.sh

      # Requires a one-time manual enable: Settings -> Pages -> Source ->
      # "GitHub Actions". The workflow token cannot create the Pages site itself
      # on this repo, so `enablement: true` is intentionally not set -- it would
      # fail with a confusing "not accessible by integration" instead of the
      # clear "verify that the repository has Pages enabled" this produces.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
