name: Release

# Cuts a SpacePill release: bump version, tag, build, (optionally) sign +
# notarize, and publish a GitHub Release with the DMG.
#
# TWO WAYS TO TRIGGER
#   1. One click: Actions -> Release -> Run workflow, pick a bump (patch/minor/
#      major) or type an exact version. The workflow bumps VERSION, commits, and
#      tags for you.
#   2. Push a tag yourself: `git tag v1.2.0 && git push origin v1.2.0`. The
#      workflow builds and publishes that tag as-is (no version commit).
#
# SIGNING IS OPTIONAL. With no signing secrets the build is ad-hoc signed and
# published as a developer preview -- fine while there are no users. Add the
# secrets documented in .github/RELEASING.md and the same workflow starts
# producing signed, notarized DMGs with no other change.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (ignored if "version" is set)'
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: 'Exact version, e.g. 1.2.0 (overrides bump)'
        type: string
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create releases, push the version commit and tag

jobs:
  release:
    runs-on: macos-15
    env:
      # Hoisted to job env because the `secrets` context is NOT available in
      # step `if:` conditions -- `env` is. Empty when no cert is configured.
      CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Resolve the version and, for a manual dispatch, bump VERSION + tag.
      # A tag push arrives with the version already decided (the tag itself).
      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            CURRENT="$(cat VERSION)"
            if [[ -n "${{ inputs.version }}" ]]; then
              VERSION="${{ inputs.version }}"
            else
              IFS=. read -r MA MI PA <<< "$CURRENT"
              case "${{ inputs.bump }}" in
                major) MA=$((MA+1)); MI=0; PA=0 ;;
                minor) MI=$((MI+1)); PA=0 ;;
                patch) PA=$((PA+1)) ;;
              esac
              VERSION="${MA}.${MI}.${PA}"
            fi
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a semver x.y.z"; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit version bump and tag
        if: steps.ver.outputs.mode == 'dispatch'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          echo "$V" > VERSION
          git add VERSION
          git commit -m "Release v$V"
          git tag "v$V"
          git push origin HEAD:main
          git push origin "v$V"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run tests
        run: ./bin/test.sh

      # Import the Developer ID cert into an ephemeral keychain only if it was
      # provided. Everything downstream keys off APPLE_IDENTITY being set.
      - name: Set up code signing
        id: signing
        if: ${{ env.CERT_P12_BASE64 != '' }}
        env:
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 20)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # Put our keychain on the search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity in the imported cert"; exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Signing identity: $IDENTITY"
          rm -f "$RUNNER_TEMP/cert.p12"

      # bin/package.sh is the single build engine, shared with local releases.
      # It signs + notarizes when APPLE_IDENTITY (and the notary creds) are set,
      # and builds ad-hoc otherwise -- so an unsigned preview needs no secrets.
      - name: Build and package
        env:
          APPLE_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./bin/package.sh

      - name: Checksum
        id: sum
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 staging/SpacePill.dmg | cut -d' ' -f1)"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  SpacePill.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.identity != '' }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if [[ "$SIGNED" == "true" ]]; then
            NOTE="Signed and notarized release."
          else
            NOTE="⚠️ Developer preview: this build is **not** signed or notarized. macOS Gatekeeper will warn on first launch, and \`spacepill update\` will refuse to auto-install it. Add signing secrets (see .github/RELEASING.md) for production releases."
          fi
          gh release create "v$V" staging/SpacePill.dmg \
            --title "v$V" \
            --notes "$NOTE"$'\n\n'"SHA-256: \`${{ steps.sum.outputs.sha256 }}\`" \
            --verify-tag
